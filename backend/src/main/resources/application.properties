spring.application.name=asset-management-backend
server.port=8080

# H2 in-memory database (data resets on every restart)
spring.datasource.url=jdbc:h2:mem:assetdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# H2 web console for the demo: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:assetdb)
spring.h2.console.enabled=true

# Frontend origin allowed by CORS
app.cors.allowed-origin=http://localhost:3000
